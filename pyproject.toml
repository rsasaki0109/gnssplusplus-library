[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "gnsspp"
dynamic = ["version"]
description = "libgnss++: GNSS processing (SPP, RTK, PPP, CLAS, FGO, GNSS/IMU) with the gnss command suite and Python bindings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "LibGNSS++ Contributors" }]
keywords = ["gnss", "gps", "rtk", "ppp", "rinex", "rtcm", "positioning"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
]
# Same runtime set as the Debian package (CPACK_DEBIAN_PACKAGE_DEPENDS).
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
# Used by a few analysis, benchmark and plotting commands.
full = ["pandas", "scipy", "pillow", "pyyaml", "tomli; python_version < '3.11'"]

[project.scripts]
gnss = "libgnsspp._cli:main"

[project.urls]
Homepage = "https://github.com/rsasaki0109/gnssplusplus-library"
Documentation = "https://rsasaki0109.github.io/gnssplusplus-library/"
Issues = "https://github.com/rsasaki0109/gnssplusplus-library/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# >=3.18 for the Eigen download fallback (file(ARCHIVE_EXTRACT)).
cmake.version = ">=3.18"
cmake.build-type = "Release"
# Install the regular CMake prefix (bin/, share/, configs/, ...) inside the
# libgnsspp package so the gnss dispatcher resolves everything relative to
# itself; the C++ SDK ("Development" component) stays out of the wheel.
wheel.install-dir = "libgnsspp"
wheel.packages = []
install.components = ["Unspecified"]
install.strip = true
# Leading "/" anchors each pattern at the repository root (gitignore rules;
# include/libgnss++/external/ must stay).
sdist.exclude = [
    "/build*/", "/output/", "/data/", "/site/", "/site-pages/", "/web/",
    "/wasm/", "/ros2/", "/docs/", "/external/", "/.github/",
]
# apps/CMakeLists.txt installs these from docs/.
sdist.include = ["/docs/online_pva*"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(gnss_lib VERSION (?P<value>[0-9.]+)'

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
GNSSPP_BUILD_EXAMPLES = "OFF"
GNSSPP_BUILD_PYTHON_BINDINGS = "ON"
# Keep the wheel self-contained: no optional system shared libraries.
GNSSPP_USE_CHOLMOD = "OFF"
CMAKE_DISABLE_FIND_PACKAGE_GTSAM = "ON"
CMAKE_DISABLE_FIND_PACKAGE_OpenCV = "ON"
CMAKE_DISABLE_FIND_PACKAGE_ament_cmake = "ON"

# Wheels for PyPI (.github/workflows/pypi.yml); also runs locally with
# `pipx run cibuildwheel --only cp313-manylinux_x86_64`.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# musllinux and free-threaded interpreters are not built or tested.
skip = "*-musllinux_* cp3??t-*"
build-verbosity = 1
# Runs in a temporary directory with the wheel installed.
test-command = [
    "python -c \"import libgnsspp; print(libgnsspp.ecef_to_geodetic_deg)\"",
    "gnss --help",
    "gnss demo --output-dir demo-out",
]

[tool.cibuildwheel.linux]
# Eigen in the manylinux_2_28 image is 3.3, which rejects C++20; the build
# downloads the Eigen 3.4.0 headers instead (see CMakeLists.txt).
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "4" }
