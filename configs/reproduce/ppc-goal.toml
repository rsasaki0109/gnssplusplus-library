  "--residual-spike-max-satellites", "14",
]

# 9. Score libgnss++ and gici-open with the common metric implementation.
[[steps]]
name = "score-libgnss-matrix"
argv = [
  "{python}", "scripts/experiments/ppc/summarize_fgo_ppc_matrix.py",
  "--dataset-root", "{ppc_root}",
  "--pos", "tokyo/run1={work_dir}/staged/tokyo_run1.pos",
  "--pos", "tokyo/run2={work_dir}/staged/tokyo_run2.pos",
  "--pos", "tokyo/run3={work_dir}/staged/tokyo_run3.pos",
  "--pos", "nagoya/run1={work_dir}/staged/nagoya_run1.pos",
  "--pos", "nagoya/run2={work_dir}/staged/nagoya_run2.pos",
  "--pos", "nagoya/run3={work_dir}/staged/nagoya_run3.pos",
  "--match-tolerance-s", "0.11",
  "--output-json", "{work_dir}/kf_fgo_staged_integrity_full_matrix.json",
  "--markdown-output", "{work_dir}/kf_fgo_staged_integrity_full_matrix.md",
]

[[steps]]
name = "score-gici-matrix"
argv = [
  "{python}", "scripts/experiments/ppc/summarize_fgo_ppc_matrix.py",
  "--dataset-root", "{ppc_root}",
  "--pos", "tokyo/run1={ppc_goal_inputs_root}/gici_common/tokyo1.pos",
  "--pos", "tokyo/run2={ppc_goal_inputs_root}/gici_common/tokyo2.pos",
  "--pos", "tokyo/run3={ppc_goal_inputs_root}/gici_common/tokyo3.pos",
  "--pos", "nagoya/run1={ppc_goal_inputs_root}/gici_common/nagoya1.pos",
  "--pos", "nagoya/run2={ppc_goal_inputs_root}/gici_common/nagoya2.pos",
  "--pos", "nagoya/run3={ppc_goal_inputs_root}/gici_common/nagoya3.pos",
  "--match-tolerance-s", "0.11",
  "--output-json", "{work_dir}/gici_reproduction_ppc_matrix.json",
  "--markdown-output", "{work_dir}/gici_reproduction_ppc_matrix.md",
]

# 10. Rescore the Nagoya 1 FIX-target profile (no solver run).
[[steps]]
name = "score-nagoya1-fix-target-profile"
argv = [
  "{gnss}", "ppc-demo",
  "--dataset-root", "{ppc_root}",
  "--city", "nagoya", "--run", "run1", "--solver", "rtk",
  "--use-existing-solution",
  "--out", "{ppc_goal_inputs_root}/goal_kf_current_r2_min8_rate20_rescue29_8/solution.pos",
  "--summary-json", "{work_dir}/nagoya1_fix_target_summary.json",
  "--match-tolerance-s", "0.25",
]

# 11. Goal scorecard and its two README figures (work-dir copies).
[[steps]]
name = "goal-scorecard"
env = { MPLBACKEND = "Agg" }
argv = [
  "{python}", "scripts/experiments/ppc/generate_ppc_goal_scorecard.py",
  "--lib-matrix", "{work_dir}/kf_fgo_staged_integrity_full_matrix.json",
  "--gici-matrix", "{work_dir}/gici_reproduction_ppc_matrix.json",
