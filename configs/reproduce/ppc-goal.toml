# README section "PPC 2024 goal matrix vs Kaiyodai and gici-open" (78.8455%
# official score, the six-run libgnss++ / gici-open table, the Nagoya 1
# FIX-target profile) and docs/ppc_kf_fgo_goal_metrics.json,
# docs/ppc_libgnss_gici_comparison.png, docs/ppc_public_targets.png,
# docs/ppc_kf_fgo_fix_status_xy.png.
#
# Stage: score-only from frozen tier inputs. The solver outputs at the bottom
# of the chain (tier-2 selected KF trajectories, tightly-coupled candidates,
# FGO shadow windows) were produced by commands that were never recorded (see
# docs/ppc_reproduction.md "Tier provenance"), so they are frozen by SHA-256 in
# scripts/experiments/ppc/stage_ppc_goal_inputs.py together with the six
# gici-open trajectories and the Nagoya 1 FIX-target solution (26 files,
# ~33 MB, not committed). Pass their directory (historical output/ layout)
# with --ppc-goal-inputs or GNSSPP_PPC_GOAL_INPUTS.
#
# Everything downstream is replayed here: the truth-free selector / consensus /
# status-demotion chain of docs/ppc_reproduction.md (pure Python, seconds),
# then scoring, figures, the wrong-FIX event ledger and the goal contract. No
# solver runs.

[lane]
name = "ppc-goal"
status = "ready"
title = "PPC 2024 goal matrix: audited KF/FGO selected profile vs public targets and gici-open"
readme_row = "PPC goal: 78.8455% official score, Tokyo 1 FIX 80.861%, Nagoya 1 FIX 85.100974%"
runtime_estimate = "~2 min"
docs = "docs/ppc_reproduction.md#audited-kffgo-goal-matrix-and-gici-open"

[datasets.ppc]
required = [
  "tokyo/run1/reference.csv", "tokyo/run2/reference.csv", "tokyo/run3/reference.csv",
  "nagoya/run1/reference.csv", "nagoya/run2/reference.csv", "nagoya/run3/reference.csv",
  "nagoya/run1/rover.obs", "nagoya/run1/base.obs", "nagoya/run1/base.nav",
]

[datasets.ppc_goal_inputs]
required = [
  "tokyo1_selected_quality_rtkbaseline_tier2_truthfree.pos",
  "tokyo2_selected_quality_rtkbaseline_tier2_truthfree.pos",
  "tokyo3_selected_quality_rtkbaseline_tier2_truthfree.pos",
  "tc_m3_full_t1_on/rtk.pos",
  "nagoya2_selected_quality_rtkbaseline_tier2_truthfree.pos",
  "probe_fuse_nagoya2_full_tc_m4.pos",
  "hybrid_nagoya1_multistage_m4_fixedpos_bridge05_vertical025_veld_vertical10_truthfree.pos",
  "nagoya3_selected_quality_rtkbaseline_truthfree.pos",
  "fgo_partial_noreset_ddpranchor_nagoya3_first2100_ecef.csv",
  "fgo_partial_noreset_ddpranchor_nagoya3_start2000_3000_ecef.csv",
  "fgo_shipping_tokyo3_start10950_400_ecef.csv",
  "fgo_shipping_tokyo3_start11150_400_ecef.csv",
  "fgo_shipping_tokyo1_full_ecef.csv",
  "fgo_shipping_nhc_tokyo1_start6500_3500_ecef.csv",
  "fgo_shipping_nhc_tokyo1_start7100_500_ecef.csv",
  "fgo_shipping_nhc_tokyo1_start8000_1000_ecef.csv",
  "fgo_shipping_nhc_tokyo1_start9400_700_ecef.csv",
  "fgo_shipping_tokyo2_full_ecef.csv",
  "fgo_shipping_nhc_tokyo2_start3000_1000_ecef.csv",
  "gici_common/tokyo1.pos", "gici_common/tokyo2.pos", "gici_common/tokyo3.pos",
  "gici_common/nagoya1.pos", "gici_common/nagoya2.pos", "gici_common/nagoya3.pos",
  "goal_kf_current_r2_min8_rate20_rescue29_8/solution.pos",
]

[tools.gici_open]
repository = "https://github.com/inuex35/gici-open"
commit = "e7666110a88d22e08aad24345a253564af9b8024 (forppc2024)"
note = "GPL-3.0; only its converted NMEA output (gici_common/*.pos, SHA-256 pinned) enters this lane"

# 1. Verify every frozen input against its pinned SHA-256.
[[steps]]
name = "verify-ppc-goal-inputs"
argv = [
  "{python}", "scripts/experiments/ppc/stage_ppc_goal_inputs.py",
  "--inputs-root", "{ppc_goal_inputs_root}",
  "--summary-json", "{work_dir}/inputs_verification.json",
]

# 2. Tokyo 1 tier 3: tightly-coupled RTK candidate positions.
[[steps]]
name = "tokyo1-tier3-select"
argv = [
  "{python}", "scripts/experiments/ppc/select_pos_candidate_quality.py",
  "--baseline-pos", "{ppc_goal_inputs_root}/tokyo1_selected_quality_rtkbaseline_tier2_truthfree.pos",
  "--candidate-pos", "{ppc_goal_inputs_root}/tc_m3_full_t1_on/rtk.pos",
  "--output-pos", "{work_dir}/chain/tokyo1_selected_quality_tcm3_tier3_truthfree.pos",
  "--summary-json", "{work_dir}/chain/tokyo1_selected_quality_tcm3_tier3_truthfree.json",
  "--candidate-status", "4", "--candidate-min-ratio", "2",
  "--candidate-min-satellites", "8",
  "--candidate-max-post-rms-m", "0",
  "--candidate-max-nis-per-observation", "0",
  "--min-position-separation-m", "2",
]

# 3. Nagoya 2 wrong-basin escape.
[[steps]]
name = "nagoya2-wrong-basin-escape"
argv = [
  "{python}", "scripts/experiments/ppc/select_pos_candidate_quality.py",
  "--baseline-pos", "{ppc_goal_inputs_root}/nagoya2_selected_quality_rtkbaseline_tier2_truthfree.pos",
  "--candidate-pos", "{ppc_goal_inputs_root}/probe_fuse_nagoya2_full_tc_m4.pos",
  "--output-pos", "{work_dir}/chain/nagoya2_wrong_basin_fgo_escape_truthfree.pos",
  "--summary-json", "{work_dir}/chain/nagoya2_wrong_basin_fgo_escape_truthfree.json",
  "--candidate-status", "3", "--candidate-min-ratio", "0",
  "--candidate-min-satellites", "0",
  "--candidate-max-post-rms-m", "0",
  "--candidate-max-nis-per-observation", "0",
  "--baseline-min-prefit-rms-m", "8",
  "--baseline-min-outliers", "45",
  "--replace-status",
  "--min-position-separation-m", "0",
]

# 4. Nagoya 3 causal KF/FGO status-only consensus.
[[steps]]
name = "nagoya3-online-consensus"
argv = [
  "{python}", "scripts/experiments/ppc/apply_ppc_integrity_consensus.py",
  "--primary-pos", "{ppc_goal_inputs_root}/nagoya3_selected_quality_rtkbaseline_truthfree.pos",
  "--shadow-csv", "{ppc_goal_inputs_root}/fgo_partial_noreset_ddpranchor_nagoya3_first2100_ecef.csv",
  "--shadow-csv", "{ppc_goal_inputs_root}/fgo_partial_noreset_ddpranchor_nagoya3_start2000_3000_ecef.csv",
  "--output-pos", "{work_dir}/chain/nagoya3_selected_online_consensus_a11_recovery.pos",
  "--summary-json", "{work_dir}/chain/nagoya3_selected_online_consensus_a11_recovery.json",
  "--ledger-csv", "{work_dir}/chain/nagoya3_selected_online_consensus_a11_recovery_ledger.csv",
  "--agreement-aperture-m", "11",
  "--allow-recovery-fixed-output",
]

# 5. Satellite gate + exoneration + staged kinematic quarantine.
[[steps]]
name = "kinematic-advanced-status-demotion"
argv = [
  "{python}", "scripts/experiments/ppc/apply_ppc_status_demotion.py",
  "--pos", "tokyo_run1={work_dir}/chain/tokyo1_selected_quality_tcm3_tier3_truthfree.pos",
  "--pos", "tokyo_run2={ppc_goal_inputs_root}/tokyo2_selected_quality_rtkbaseline_tier2_truthfree.pos",
  "--pos", "tokyo_run3={ppc_goal_inputs_root}/tokyo3_selected_quality_rtkbaseline_tier2_truthfree.pos",
  "--pos", "nagoya_run1={ppc_goal_inputs_root}/hybrid_nagoya1_multistage_m4_fixedpos_bridge05_vertical025_veld_vertical10_truthfree.pos",
  "--pos", "nagoya_run2={work_dir}/chain/nagoya2_wrong_basin_fgo_escape_truthfree.pos",
  "--pos", "nagoya_run3={work_dir}/chain/nagoya3_selected_online_consensus_a11_recovery.pos",
  "--output-dir", "{work_dir}/kinematic_advanced",
  "--min-satellites", "8",
  "--low-satellite-ceiling", "11",
  "--low-satellite-max-ratio", "15",
  "--exonerate-min-satellites", "11",
  "--exonerate-max-prefit-rms-m", "0.5",
  "--exonerate-max-nis-per-obs", "0.2",
  "--kinematic-max-jump-m", "12",
  "--kinematic-min-acceleration-mps2", "200",
  "--kinematic-hold-epochs", "3",
  "--kinematic-plateau-max-jump-m", "0.1",
  "--kinematic-max-hold-epochs", "8",
  "--kinematic-secondary-min-jump-m", "5",
  "--kinematic-secondary-min-acceleration-mps2", "100",
  "--kinematic-secondary-min-prefit-rms-m", "5",
  "--kinematic-secondary-max-ratio", "10",
  "--kinematic-secondary-min-outliers", "10",
  "--kinematic-secondary-max-satellites", "13",
]

# 6. Tokyo 3 two-window FGO status consensus.
[[steps]]
name = "tokyo3-online-consensus"
argv = [
  "{python}", "scripts/experiments/ppc/apply_ppc_integrity_consensus.py",
  "--primary-pos", "{work_dir}/kinematic_advanced/tokyo_run3.pos",
  "--shadow-csv", "{ppc_goal_inputs_root}/fgo_shipping_tokyo3_start10950_400_ecef.csv",
  "--shadow-csv", "{ppc_goal_inputs_root}/fgo_shipping_tokyo3_start11150_400_ecef.csv",
  "--output-pos", "{work_dir}/chain/tokyo3_advanced_online_consensus_fgo_a5_gdop4_two_window.pos",
  "--summary-json", "{work_dir}/chain/tokyo3_advanced_online_consensus_fgo_a5_gdop4_two_window_summary.json",
  "--ledger-csv", "{work_dir}/chain/tokyo3_advanced_online_consensus_fgo_a5_gdop4_two_window_ledger.csv",
  "--agreement-aperture-m", "5", "--shadow-max-gdop", "4",
  "--allow-recovery-fixed-output",
]

# 7. Tokyo 1 / Tokyo 2 multi-shadow position consensus. argv reconstructed from
#    the historical summary JSONs (thresholds, primary and shadow list); the
#    replay is byte-identical to the historical holdout inputs.
[[steps]]
name = "tokyo1-multi-shadow-position-consensus"
argv = [
  "{python}", "scripts/experiments/ppc/apply_ppc_fgo_position_consensus.py",
  "--primary-pos", "{work_dir}/kinematic_advanced/tokyo_run1.pos",
  "--shadow-csv", "{ppc_goal_inputs_root}/fgo_shipping_tokyo1_full_ecef.csv",
