  "--shadow-csv", "{ppc_goal_inputs_root}/fgo_shipping_nhc_tokyo1_start8000_1000_ecef.csv",
  "--shadow-csv", "{ppc_goal_inputs_root}/fgo_shipping_nhc_tokyo1_start9400_700_ecef.csv",
  "--output-pos", "{work_dir}/chain/tokyo1_fresh_kinematic_multi_fgo_consensus.pos",
  "--summary-json", "{work_dir}/chain/tokyo1_fresh_kinematic_multi_fgo_consensus_summary.json",
  "--min-independent-shadows", "2",
  "--shadow-agreement-aperture-m", "0.25",
  "--primary-separation-min-m", "0.5",
  "--fresh-shadow-max-age-epochs", "1000",
  "--candidate-max-prediction-error-m", "2",
]

[[steps]]
name = "tokyo2-multi-shadow-position-consensus"
argv = [
  "{python}", "scripts/experiments/ppc/apply_ppc_fgo_position_consensus.py",
  "--primary-pos", "{work_dir}/kinematic_advanced/tokyo_run2.pos",
  "--shadow-csv", "{ppc_goal_inputs_root}/fgo_shipping_tokyo2_full_ecef.csv",
  "--shadow-csv", "{ppc_goal_inputs_root}/fgo_shipping_nhc_tokyo2_start3000_1000_ecef.csv",
  "--output-pos", "{work_dir}/chain/tokyo2_holdout_fresh_kinematic_fgo_consensus.pos",
  "--summary-json", "{work_dir}/chain/tokyo2_holdout_fresh_kinematic_fgo_consensus_summary.json",
  "--min-independent-shadows", "2",
  "--shadow-agreement-aperture-m", "0.25",
  "--primary-separation-min-m", "0.5",
  "--fresh-shadow-max-age-epochs", "1000",
  "--candidate-max-prediction-error-m", "2",
]

# 8. Staged bounded-latency integrity policy -> the six final POS files.
[[steps]]
name = "staged-integrity-policy"
argv = [
  "{python}", "scripts/experiments/ppc/apply_ppc_status_demotion.py",
  "--pos", "tokyo_run1={work_dir}/chain/tokyo1_fresh_kinematic_multi_fgo_consensus.pos",
  "--pos", "tokyo_run2={work_dir}/chain/tokyo2_holdout_fresh_kinematic_fgo_consensus.pos",
  "--pos", "tokyo_run3={work_dir}/chain/tokyo3_advanced_online_consensus_fgo_a5_gdop4_two_window.pos",
  "--pos", "nagoya_run1={work_dir}/kinematic_advanced/nagoya_run1.pos",
  "--pos", "nagoya_run2={work_dir}/kinematic_advanced/nagoya_run2.pos",
  "--pos", "nagoya_run3={work_dir}/kinematic_advanced/nagoya_run3.pos",
  "--output-dir", "{work_dir}/staged",
  "--min-satellites", "8",
  "--low-satellite-ceiling", "11",
  "--low-satellite-max-ratio", "15",
  "--exonerate-min-satellites", "11",
  "--exonerate-max-prefit-rms-m", "0.5",
  "--exonerate-max-nis-per-obs", "0.2",
  "--residual-streak-min-prefit-rms-m", "40",
  "--residual-streak-max-ratio", "15",
  "--residual-streak-min-outliers", "12",
  "--residual-streak-min-outlier-fraction", "0.5",
