# Local reproduction (2026-09-29, Windows 11, develop 2f919306): every replayed
# intermediate (tier-3 Tokyo 1, Nagoya 2 escape, Nagoya 3 consensus, the six
# kinematic-advanced POS, Tokyo 3 consensus, Tokyo 1/2 position consensus, the
# three surviving staged Nagoya POS) is byte-identical to the historical file,
# and both scored matrices match the historical JSON field for field. The
# tolerances below are the README's display rounding (3 decimals, 6 for the
# headline values that the README quotes to 6).

[[metrics]]
name = "distance-weighted PPC official score (%)"
source = "{work_dir}/ppc_kf_fgo_goal_metrics.json"
path = "weighted_official_score_pct"
expected = 78.845491
abs_tol = 0.0000005
readme = "78.8455% / 78.845491%"

[[metrics]]
name = "target {key} achieved (%)"
source = "{work_dir}/ppc_kf_fgo_goal_metrics.json"
path = "targets[key={key}].achieved_pct"
readme = "public targets 80.8% / 85.1% / 78.7%"
foreach = [
  { key = "tokyo1_fix", expected = 80.860848, abs_tol = 0.0000005 },
  { key = "nagoya1_fix", expected = 85.100974, abs_tol = 0.0000005 },
  { key = "ppc_official", expected = 78.845491, abs_tol = 0.0000005 },
]

[[metrics]]
name = "Nagoya 1 FIX-target profile {field}"
source = "{work_dir}/ppc_kf_fgo_goal_metrics.json"
path = "targets[key=nagoya1_fix].{field}"
readme = "0.913% Wrong FIX/FIX, 1.460 m P95 H"
foreach = [
  { field = "wrong_fix_rate_pct", expected = 0.913, abs_tol = 0.0005 },
  { field = "p95_h_m", expected = 1.460, abs_tol = 0.0005 },
]

