# README prose: "+16.613 pp" FIX macro, Wrong FIX/FIX "1.025 pp" lower.
[[metrics]]
name = "FIX macro advantage over gici-open (pp)"
source = "{work_dir}/ppc_kf_fgo_goal_metrics.json"
path = "macro_mean.libgnss.fix_rate_pct"
minus_path = "macro_mean.gici.fix_rate_pct"
expected = 16.613
abs_tol = 0.0005
readme = "+16.613 pp"

[[metrics]]
name = "Wrong FIX/FIX macro reduction vs gici-open (pp)"
source = "{work_dir}/ppc_kf_fgo_goal_metrics.json"
path = "macro_mean.gici.wrong_fix_rate_pct"
minus_path = "macro_mean.libgnss.wrong_fix_rate_pct"
expected = 1.025
abs_tol = 0.0005
readme = "1.025 pp lower"

