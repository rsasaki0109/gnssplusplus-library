# README "Smartphone GNSS/IMU" table "Base-surveyed correction on the GSDC dev
# routes (Pixel5, (P50+P95)/2 m)" and docs/gsdc_base_surveyed_osm.png.
# Record: docs/use_cases/records/smartphone_base_surveyed_route_results_v1.md.
#
# Needs a GTSAM 4.3 build of gnss_fgo_imu_no_base (configure with
# -DGTSAM_DIR=...). On Windows set GTSAM_BIN_DIR to the directory holding the
# GTSAM DLLs; the run wrapper prepends it to PATH.
#
# Steps: stage the raw GSDC 2023 inputs (SHA-256 pinned, byte-identical to the
# research harness inputs), run the four routes one gnss_fgo_imu_no_base process
# at a time, then score (P50+P95)/2 on the exact UnixTimeMillis join. The OSM
# figure downloads map tiles and is only drawn with --update-docs.
#
# Recipes. H/U/A: the flag set printed in the record ("A uses the same flag
# set", "U uses the phase37 U inputs"). LAX-T: the phase476 LAX-T argv
# (docs/use_cases/records/smartphone_r5_phase476_lax_t_comparison_manifest_v1.json
# in tag archive/research-phase-2026-09-28) + the phase538 joint ionosphere
# (--native-joint-ionosphere 3 0.02 1.5, scripts/run_phase538_joint_transfer.py
# in the same tag) + the record's base additions. Surveyed base ECEF: taroz
# gsdc2023 base/base_position.csv, year-matched (cross-checked by the stager).

[lane]
name = "gsdc-dev-routes"
status = "ready"
title = "GSDC Pixel5 base-surveyed dev routes (P50+P95)/2"
readme_row = "Smartphone dev routes: H 0.577 / U 0.738 / A 0.302 / LAX-T 0.712 m"
runtime_estimate = "~25 min"
docs = "docs/use_cases/records/smartphone_base_surveyed_route_results_v1.md"

[datasets.gsdc]
required = [
  "train/2021-08-24-20-32-us-ca-mtv-h/pixel5/device_gnss.csv",
  "train/2021-08-24-20-32-us-ca-mtv-h/pixel5/device_imu.csv",
  "train/2021-08-24-20-32-us-ca-mtv-h/brdc.nav",
  "train/2021-08-24-20-32-us-ca-mtv-h/P221_rnx2.obs",
  "train/2023-03-08-21-34-us-ca-mtv-u/pixel5/device_gnss.csv",
  "train/2023-03-08-21-34-us-ca-mtv-u/pixel5/device_imu.csv",
  "train/2023-03-08-21-34-us-ca-mtv-u/brdc.nav",
  "train/2023-03-08-21-34-us-ca-mtv-u/P221_rnx2.obs",
  "train/2021-03-16-18-59-us-ca-mtv-a/pixel5/device_gnss.csv",
  "train/2021-03-16-18-59-us-ca-mtv-a/pixel5/device_imu.csv",
  "train/2021-03-16-18-59-us-ca-mtv-a/brdc.nav",
  "train/2021-03-16-18-59-us-ca-mtv-a/SLAC_rnx2.obs",
  "train/2022-04-01-18-22-us-ca-lax-t/pixel5/device_gnss.csv",
  "train/2022-04-01-18-22-us-ca-lax-t/pixel5/device_imu.csv",
  "train/2022-04-01-18-22-us-ca-lax-t/brdc.nav",
  "train/2022-04-01-18-22-us-ca-lax-t/LBCH_rnx2.obs",
]

[tools.gtsam]
version = "4.3.x"
build = "cmake -DGTSAM_DIR=<gtsam>/lib/cmake/GTSAM ...; cmake --build <build> --target gnss_fgo_imu_no_base"
runtime = "Linux: LD_LIBRARY_PATH must include the GTSAM libs; Windows: set GTSAM_BIN_DIR to the GTSAM DLL directory"

[tools.gsdc2023]
dataset = "taroz dataset_2023 (GSDC 2023 train + CORS base RINEX + brdc.nav), https://github.com/taroz/gsdc2023"
archive_sha256 = "bda30ab456e6fd6f83550c246e8dbd287306d5385f1f1069c99c16298e647408"

# 1. Stage the per-route inputs and verify every SHA-256.
[[steps]]
name = "stage-gsdc-dev-route-inputs"
argv = [
  "{python}", "scripts/experiments/gsdc/stage_gsdc_dev_route_inputs.py",
  "--gsdc-root", "{gsdc_root}",
  "--truth-root", "{gsdc_truth_root}",
  "--out", "{work_dir}/inputs",
]

# 2. H / U / A: the record's base-surveyed flag set.
[[steps]]
name = "fgo-base-surveyed-{route}"
foreach = [
  { route = "H", dataset = "2021-08-24-20-32-us-ca-mtv-h/pixel5", base_sha = "4d3e37cbe0347fa56216db54ede9e0f30731885f337f1653ab5a86afb2bb2150", x = "-2698117.9416", y = "-4301326.2649", z = "3847286.2750" },
  { route = "U", dataset = "2023-03-08-21-34-us-ca-mtv-u/pixel5", base_sha = "aedb7a39e7b6612ea97964b363c74cd2c10318255b7f2287f4720d18e71803e6", x = "-2698117.9861", y = "-4301326.2071", z = "3847286.2977" },
  { route = "A", dataset = "2021-03-16-18-59-us-ca-mtv-a/pixel5", base_sha = "380b8ff9091344fb756697e27f0983d9a0ba2cf0c201b96849bfc1ecc1af0e52", x = "-2703116.3177", y = "-4291766.7551", z = "3854248.0736" },
]
argv = [
  "{python}", "scripts/experiments/gsdc/gsdc_dev_routes_reproduce.py", "run",
  "--label", "{route}",
  "--log", "{work_dir}/runs/{route}/solver.log",
  "--summary-json", "{work_dir}/runs/{route}/run_summary.json",
  "--",
  "{bin:gnss_fgo_imu_no_base}",
  "--dataset-id", "{dataset}",
  "--android-gnss", "{work_dir}/inputs/{route}/device_gnss.csv",
  "--android-imu", "{work_dir}/inputs/{route}/device_imu.csv",
  "--nav", "{work_dir}/inputs/{route}/brdc.nav",
  "--all-epochs", "--android-raw-utc-keys", "--android-raw-clock-only",
  "--android-utc-wall-clock-fallback", "--native-pdc-imu-tdcp-no-bridge",
  "--native-source-direct-observable-quality", "--native-source-clock-c0d-factor",
  "--native-source-clock-c0d-meter-state-parity",
  "--native-source-clock-c0d-active-solve-diagnostic",
  "--native-source-clock-c0d-gnss-first-meter-state-handoff",
  "--native-source-clock-c0d-epoch-vector-parity",
  "--native-source-clock-c0d-phase99-main-multifrontal-qr-solver",
  "--native-phase157-raw-p-bootstrap", "--native-phase165-raw-p-no-doppler-graph",
  "--native-phase167-raw-p-no-doppler-lm-termination-budget",
  "--native-phase171-raw-p-no-doppler-imu-main",
  "--native-phase171-raw-p-ecef-doppler-gnss-first",
  "--native-phase197-source-utc-fallback-imu-offset", "--native-phase217-main-pose3-motion",
  "--native-upstream-stop-constraints", "--native-phase213-main-doppler",
  "--native-source-tdcp-meter-sigma", "--native-lm-lambda-floor",
  "--native-base-pseudorange-compensation", "--native-base-pseudorange-source-miss-mask",
  "--native-base-rinex", "{work_dir}/inputs/{route}/base.obs",
  "--native-base-rinex-sha256", "{base_sha}",
  "--native-base-position-ecef", "{x}", "{y}", "{z}",
  "--out", "{work_dir}/runs/{route}/solution.csv",
  "--summary-json", "{work_dir}/runs/{route}/native_summary.json",
]

# 3. LAX-T: phase476 LAX-T argv + phase538 joint ionosphere + base-surveyed.
[[steps]]
name = "fgo-base-surveyed-LAX-T"
argv = [
  "{python}", "scripts/experiments/gsdc/gsdc_dev_routes_reproduce.py", "run",
  "--label", "LAX-T",
  "--log", "{work_dir}/runs/LAX-T/solver.log",
  "--summary-json", "{work_dir}/runs/LAX-T/run_summary.json",
  "--",
  "{bin:gnss_fgo_imu_no_base}",
  "--dataset-id", "2022-04-01-18-22-us-ca-lax-t/pixel5",
  "--android-gnss", "{work_dir}/inputs/LAX-T/device_gnss.csv",
  "--android-imu", "{work_dir}/inputs/LAX-T/device_imu.csv",
  "--nav", "{work_dir}/inputs/LAX-T/brdc.nav",
  "--all-epochs", "--android-raw-utc-keys", "--android-raw-clock-only",
  "--android-utc-wall-clock-fallback", "--native-pdc-imu-tdcp-no-bridge",
  "--native-source-direct-observable-quality", "--native-source-clock-c0d-factor",
  "--native-source-clock-c0d-meter-state-parity",
  "--native-source-clock-c0d-active-solve-diagnostic",
  "--native-source-clock-c0d-gnss-first-meter-state-handoff",
  "--native-source-clock-c0d-epoch-vector-parity",
  "--native-source-clock-c0d-phase99-main-multifrontal-qr-solver",
  "--native-phase157-raw-p-bootstrap", "--native-phase165-raw-p-no-doppler-graph",
  "--native-phase167-raw-p-no-doppler-lm-termination-budget",
  "--native-phase171-raw-p-no-doppler-imu-main",
  "--native-phase171-raw-p-ecef-doppler-gnss-first",
  "--native-phase197-source-utc-fallback-imu-offset", "--native-phase217-main-pose3-motion",
  "--native-upstream-stop-constraints", "--native-phase213-main-doppler",
  "--native-source-tdcp-meter-sigma", "--android-include-first-native-epoch",
  "--native-sparse-p-staging", "--native-lm-lambda-floor",
  "--native-joint-ionosphere", "3", "0.02", "1.5",
  "--native-base-pseudorange-compensation", "--native-base-pseudorange-source-miss-mask",
  "--native-base-rinex", "{work_dir}/inputs/LAX-T/base.obs",
  "--native-base-rinex-sha256", "d731e0e8a7ba4396d62340c85b6238e66c50c6a349621f9dcea0ea6885fd4cfe",
  "--native-base-position-ecef", "-2507799.2243", "-4676369.3031", "3526891.0358",
  "--out", "{work_dir}/runs/LAX-T/solution.csv",
  "--summary-json", "{work_dir}/runs/LAX-T/native_summary.json",
]

# 4. Score (P50+P95)/2 per route.
[[steps]]
name = "score-gsdc-dev-routes"
argv = [
  "{python}", "scripts/experiments/gsdc/gsdc_dev_routes_reproduce.py", "score",
  "--work-dir", "{work_dir}",
  "--inputs-dir", "{work_dir}/inputs",
  "--output-json", "{work_dir}/gsdc_dev_routes_metrics.json",
  "--markdown-output", "{work_dir}/gsdc_dev_routes_table.md",
]

# OSM figure (downloads tiles from tile.openstreetmap.org).
[[docs_steps]]
name = "update-docs-gsdc-base-surveyed-osm"
argv = [
  "{python}", "scripts/experiments/gsdc/gsdc_dev_routes_reproduce.py", "figure",
  "--metrics-json", "{work_dir}/gsdc_dev_routes_metrics.json",
  "--output", "docs/gsdc_base_surveyed_osm.png",
]

# Local reproduction (2026-09-29, develop 4b22fe43, MSVC Release + GTSAM 4.3,
# Windows 11): H 0.57623, U 0.74045, A 0.30265, LAX-T 0.71586 m against the
# record's 0.57738 / 0.73751 / 0.30169 / 0.71207 m (Linux GCC build of
# 2026-09-17). Replays are deterministic (two H runs wrote byte-identical
# outputs). The Windows build of 274ab819 (the tree that recorded the table)
# gives H 0.57643 m, so ~1 mm of the gap is toolchain/GTSAM-build numerics and
# ~0.2 mm is solver drift since then. The gate therefore uses a 5 mm
# cross-build tolerance around the README value; the exact record values are
# reported below without gating.
[[metrics]]
name = "{route} (P50+P95)/2 m"
source = "{work_dir}/gsdc_dev_routes_metrics.json"
path = "routes[route={route}].score_m"
readme = "README base-surveyed dev-route table"
foreach = [
  { route = "H", expected = 0.577, abs_tol = 0.005 },
  { route = "U", expected = 0.738, abs_tol = 0.005 },
  { route = "A", expected = 0.302, abs_tol = 0.005 },
  { route = "LAX-T", expected = 0.712, abs_tol = 0.005 },
]

[[metrics]]
name = "{route} (P50+P95)/2 m vs record (5 decimals)"
source = "{work_dir}/gsdc_dev_routes_metrics.json"
path = "routes[route={route}].score_m"
readme = "record smartphone_base_surveyed_route_results_v1.md"
gate = false
foreach = [
  { route = "H", expected = 0.57738, abs_tol = 0.000005 },
  { route = "U", expected = 0.73751, abs_tol = 0.000005 },
  { route = "A", expected = 0.30169, abs_tol = 0.000005 },
  { route = "LAX-T", expected = 0.71207, abs_tol = 0.000005 },
]

# The inner join may drop at most the first truth epoch: the H/U/A recipe
# does not pass --android-include-first-native-epoch, so U and A have no
# solution row for their first truth epoch.
[[metrics]]
name = "{route} unmatched truth rows"
source = "{work_dir}/gsdc_dev_routes_metrics.json"
path = "routes[route={route}].unmatched_truth_rows"
max = 1
readme = "exact UnixTimeMillis join"
foreach = [{ route = "H" }, { route = "U" }, { route = "A" }, { route = "LAX-T" }]

# Reported only.
[[metrics]]
name = "{route} {field}"
source = "{work_dir}/gsdc_dev_routes_metrics.json"
path = "routes[route={route}].{field}"
min = 0
gate = false
readme = "reported"
foreach = [
  { route = "H", field = "p50_m" }, { route = "H", field = "p95_m" }, { route = "H", field = "mean_m" }, { route = "H", field = "wall_time_s" },
  { route = "U", field = "p50_m" }, { route = "U", field = "p95_m" }, { route = "U", field = "mean_m" }, { route = "U", field = "wall_time_s" },
  { route = "A", field = "p50_m" }, { route = "A", field = "p95_m" }, { route = "A", field = "mean_m" }, { route = "A", field = "wall_time_s" },
  { route = "LAX-T", field = "p50_m" }, { route = "LAX-T", field = "p95_m" }, { route = "LAX-T", field = "mean_m" }, { route = "LAX-T", field = "wall_time_s" },
]
