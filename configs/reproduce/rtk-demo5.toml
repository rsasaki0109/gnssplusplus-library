# README row "RTK | PPC Tokyo/Nagoya vs RTKLIB demo5".
# Source: docs/benchmarks.md#ppc-coverage-profile (PPC_COVERAGE_MATRIX marker block)
# and docs/ppc_reproduction.md#coverage-matrix.

[lane]
name = "rtk-demo5"
status = "ready"
title = "PPC Tokyo/Nagoya RTK coverage profile vs RTKLIB demo5 (six runs)"
readme_row = "RTK: +56.9 pp fix rate, +44.9 pp official score, -11.33 m P95 H; positioning -9.7 pp"
runtime_estimate = "~30 min"
docs = "docs/benchmarks.md"

[datasets.ppc]
required = [
  "tokyo/run1/rover.obs", "tokyo/run1/base.obs", "tokyo/run1/base.nav", "tokyo/run1/reference.csv",
  "tokyo/run2/rover.obs", "tokyo/run2/base.obs", "tokyo/run2/base.nav", "tokyo/run2/reference.csv",
  "tokyo/run3/rover.obs", "tokyo/run3/base.obs", "tokyo/run3/base.nav", "tokyo/run3/reference.csv",
  "nagoya/run1/rover.obs", "nagoya/run1/base.obs", "nagoya/run1/base.nav", "nagoya/run1/reference.csv",
  "nagoya/run2/rover.obs", "nagoya/run2/base.obs", "nagoya/run2/base.nav", "nagoya/run2/reference.csv",
  "nagoya/run3/rover.obs", "nagoya/run3/base.obs", "nagoya/run3/base.nav", "nagoya/run3/reference.csv",
]

[tools.rtklib_demo5]
repository = "https://github.com/rtklibexplorer/RTKLIB"
tag = "b34k"
commit = "55a0f2c742a605a3d27a90b17556b2cfdf98ad50"
binary = "app/consapp/rnx2rtkp (gcc makefile options: -DTRACE -DENAGLO -DENAQZS -DENAGAL -DENACMP -DENAIRN -DNFREQ=3 -DNEXOBS=3)"
config = "configs/reproduce/rtklib_demo5_ppc.conf"

# One command runs gnssplusplus (coverage profile: low-cost preset, --no-arfilter,
# default guards, ratio 2.4) and RTKLIB demo5 (tracked config, `-p 2`, reference
# window) on all six runs, then scores both against the PPC reference.
[[steps]]
name = "ppc-coverage-matrix"
argv = [
  "{gnss}", "ppc-coverage-matrix",
  "--dataset-root", "{ppc_root}",
  "--ratio", "2.4",
  "--rtklib-bin", "{rtklib_bin}",
  "--rtklib-config", "configs/reproduce/rtklib_demo5_ppc.conf",
  "--output-dir", "{work_dir}/matrix",
  "--summary-json", "{work_dir}/summary.json",
  "--markdown-output", "{work_dir}/table.md",
]

[[docs_steps]]
name = "update-benchmarks-coverage-block"
argv = [
  "{python}", "scripts/experiments/ppc/update_ppc_coverage_readme.py",
  "--summary-json", "{work_dir}/summary.json",
]

[[docs_steps]]
name = "render-ppc-rtk-demo5-scorecard"
argv = [
  "{python}", "scripts/experiments/ppc/generate_ppc_rtk_scorecard.py",
  "--summary-json", "{work_dir}/summary.json",
  "--output", "docs/ppc_rtk_demo5_scorecard.png",
]

# README values, reproduced 2026-10-10 with demo5 b34k (55a0f2c) and the tracked
# config (libgnss++ develop 31d7177f, Linux gcc 13.3 Release; the 2026-09-28 MSVC
# values were +56.8 / +45.4 / -11.44 / -9.5), then refreshed 2026-10-11 for the
# Doppler/phase slip-test interval fix (059b1b2e; was +57.0 pp fix rate, per-run
# fix 83.95 / 84.27 / 80.56 / 79.39 / 63.59 / 63.85). Tolerances absorb
# compiler/platform differences of the libgnss++ build.
[[metrics]]
name = "avg fix rate delta vs demo5 (pp)"
source = "{work_dir}/summary.json"
path = "aggregates.avg_fix_delta_pct"
expected = 56.9
abs_tol = 0.5
readme = "+56.9 pp fix rate"

[[metrics]]
name = "avg official score delta vs demo5 (pp)"
source = "{work_dir}/summary.json"
path = "aggregates.avg_official_score_delta_pct"
expected = 44.9
abs_tol = 0.5
readme = "+44.9 pp official score"

[[metrics]]
name = "avg P95 H delta vs demo5 (m)"
source = "{work_dir}/summary.json"
path = "aggregates.avg_p95_h_delta_m"
expected = -11.33
abs_tol = 0.1
readme = "-11.33 m P95 H"

[[metrics]]
name = "avg positioning delta vs demo5 (pp)"
source = "{work_dir}/summary.json"
path = "aggregates.avg_positioning_delta_pct"
expected = -9.7
abs_tol = 0.5
readme = "positioning -9.7 pp (demo5 publishes a mostly float/single solution on more epochs)"

# Per-run values in docs/benchmarks.md; reported, not gated.
[[metrics]]
name = "{key} gnssplusplus fix rate (%)"
source = "{work_dir}/summary.json"
path = "runs[key={key}].metrics.fix_rate_pct"
abs_tol = 0.5
gate = false
readme = "docs/benchmarks.md table (not gated)"
foreach = [
  { key = "tokyo_run1", expected = 83.85 },
  { key = "tokyo_run2", expected = 84.48 },
  { key = "tokyo_run3", expected = 79.89 },
  { key = "nagoya_run1", expected = 79.39 },
  { key = "nagoya_run2", expected = 63.59 },
  { key = "nagoya_run3", expected = 63.84 },
]

[[metrics]]
name = "{key} RTKLIB demo5 fix rate (%)"
source = "{work_dir}/summary.json"
path = "runs[key={key}].rtklib.fix_rate_pct"
abs_tol = 0.05
gate = false
readme = "docs/benchmarks.md table (not gated)"
foreach = [
  { key = "tokyo_run1", expected = 8.40 },
  { key = "tokyo_run2", expected = 12.63 },
  { key = "tokyo_run3", expected = 43.63 },
  { key = "nagoya_run1", expected = 20.91 },
  { key = "nagoya_run2", expected = 22.63 },
  { key = "nagoya_run3", expected = 5.60 },
]
