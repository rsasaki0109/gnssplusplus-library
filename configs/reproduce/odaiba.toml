# README row "Urban RTK | UrbanNav Tokyo Odaiba vs RTKLIB demo5".
# Source: docs/benchmarks.md#urbannav-tokyo-odaiba-snapshot.

[lane]
name = "odaiba"
status = "ready"
title = "UrbanNav Tokyo Odaiba RTK: libgnss++ default, --preset urban and --preset odaiba vs RTKLIB demo5"
readme_row = "Urban RTK (both multi-GNSS): --preset urban 7467 vs 5839 fixes, fewer wrong fixes (9/0/0 vs 19/4/4 beyond 0.5/2/3 m), lower Hmed/Hp95/Vp95; default lower Hp95/Vp95"
runtime_estimate = "~7 min"
docs = "docs/benchmarks.md"

[datasets.urbannav]
required = [
  "Odaiba/rover_trimble.obs",
  "Odaiba/base_trimble.obs",
  "Odaiba/base.nav",
  "Odaiba/reference.csv",
]

[tools.rtklib_demo5]
repository = "https://github.com/rtklibexplorer/RTKLIB"
tag = "b34k"
commit = "55a0f2c742a605a3d27a90b17556b2cfdf98ad50"
config = "scripts/rtklib_odaiba.conf"

[[steps]]
name = "odaiba-benchmark-default"
argv = [
  "{gnss}", "odaiba-benchmark",
  "--dataset-dir", "{urbannav_root}/Odaiba",
  "--rtklib-bin", "{rtklib_bin}",
  "--rtklib-config", "scripts/rtklib_odaiba.conf",
  "--rtklib-pos", "{work_dir}/rtklib_demo5.pos",
  "--lib-pos", "{work_dir}/default/rtk_solution.pos",
  "--lib-kml", "{work_dir}/default/rtk_solution.kml",
  "--comparison-png", "{work_dir}/default/driving_odaiba_comparison.png",
  "--scorecard-png", "{work_dir}/default/driving_odaiba_scorecard.png",
  "--social-card-png", "{work_dir}/default/driving_odaiba_social_card.png",
  "--summary-json", "{work_dir}/default/summary.json",
]

[[steps]]
name = "odaiba-benchmark-preset-urban"
argv = [
  "{gnss}", "odaiba-benchmark",
  "--dataset-dir", "{urbannav_root}/Odaiba",
  "--preset", "urban",
  "--use-existing-rtklib-solution",
  "--rtklib-pos", "{work_dir}/rtklib_demo5.pos",
  "--lib-pos", "{work_dir}/preset_urban/rtk_solution.pos",
  "--lib-kml", "{work_dir}/preset_urban/rtk_solution.kml",
  "--comparison-png", "{work_dir}/preset_urban/driving_odaiba_comparison.png",
  "--scorecard-png", "{work_dir}/preset_urban/driving_odaiba_scorecard.png",
  "--social-card-png", "{work_dir}/preset_urban/driving_odaiba_social_card.png",
  "--summary-json", "{work_dir}/preset_urban/summary.json",
]

[[steps]]
name = "odaiba-benchmark-preset-odaiba"
argv = [
  "{gnss}", "odaiba-benchmark",
  "--dataset-dir", "{urbannav_root}/Odaiba",
  "--preset", "odaiba",
  "--use-existing-rtklib-solution",
  "--rtklib-pos", "{work_dir}/rtklib_demo5.pos",
  "--lib-pos", "{work_dir}/preset_odaiba/rtk_solution.pos",
  "--lib-kml", "{work_dir}/preset_odaiba/rtk_solution.kml",
  "--comparison-png", "{work_dir}/preset_odaiba/driving_odaiba_comparison.png",
  "--scorecard-png", "{work_dir}/preset_odaiba/driving_odaiba_scorecard.png",
  "--social-card-png", "{work_dir}/preset_odaiba/driving_odaiba_social_card.png",
  "--summary-json", "{work_dir}/preset_odaiba/summary.json",
]

# Base station coordinate: gnss odaiba-benchmark defaults to --base-position
# surveyed, i.e. the provider-published TUMSAT base position
# (-3961904.9530, 3348993.7578, 3698211.7553), passed to libgnss++ as
# --base-ecef and to RTKLIB as -r. The base_trimble.obs header APPROX POSITION
# is 0.723 m west / 0.084 m below it; with the header every FIXED epoch of every
# solver sat ~0.70 m west of reference.csv. See docs/benchmarks.md.

# Regenerate the tracked Odaiba figures from the default-profile run.
[[docs_steps]]
name = "render-odaiba-docs-figures"
argv = [
  "{gnss}", "odaiba-benchmark",
  "--dataset-dir", "{urbannav_root}/Odaiba",
  "--use-existing-rtklib-solution",
  "--rtklib-pos", "{work_dir}/rtklib_demo5.pos",
  "--lib-pos", "{work_dir}/default/rtk_solution.pos",
  "--lib-kml", "{work_dir}/default/rtk_solution.kml",
  "--summary-json", "{work_dir}/default/summary.json",
]

# README claim, gated (reproduced 2026-10-26 with demo5 b34k, surveyed base, original
# 10 Hz Trimble rover; libgnss++ develop 8b2b77d1, Linux gcc 13.3 Release).
# scripts/rtklib_odaiba.conf ran demo5 GPS-only (pos1-navsys=1) until 2026-10-26,
# while libgnss++ uses GPS/GLONASS/Galileo/QZSS/BeiDou. That understated demo5
# (205 fixes, Hp95 25.62 m); with pos1-navsys=61 it has 5839 fixes. The former
# claims "6.3x fixes" and "lower Hmed on common epochs" for the default profile
# no longer hold and are withdrawn.
# 2026-10-26 (later): the README claim moved from --preset odaiba to
# --preset urban (the CDME fix-recovery recipe, docs/rtk_doppler_consensus_age.md).
# --preset odaiba has more fixes than demo5 but also more wrong fixes (109/5/5
# FIXED epochs beyond 0.5/2/3 m from reference.csv against 19/4/4); it is still
# run and gated against the default arm, but no longer claimed against demo5.
# Claims: --preset urban has more fixes, no more wrong fixes at each threshold,
# and a lower Hmed/Hp95/Vp95 than demo5; the default profile has a lower
# Hp95/Vp95 than demo5 (all matched epochs).
[[metrics]]
name = "preset urban fix epochs minus demo5"
source = "{work_dir}/preset_urban/summary.json"
path = "libgnss_all_epochs.fix_epochs"
minus_path = "rtklib_all_epochs.fix_epochs"
min = 1
readme = "More fixes (--preset urban)"

[[metrics]]
name = "preset urban {field} minus demo5"
source = "{work_dir}/preset_urban/summary.json"
path = "libgnss_all_epochs.{field}"
minus_path = "rtklib_all_epochs.{field}"
max = 0
readme = "fewer wrong fixes (--preset urban)"
foreach = [{ field = "fix_wrong_gt_0p5_m" }, { field = "fix_wrong_gt_2_m" }, { field = "fix_wrong_gt_3_m" }]

[[metrics]]
name = "preset urban {field} minus demo5 (m)"
source = "{work_dir}/preset_urban/summary.json"
path = "libgnss_all_epochs.{field}"
minus_path = "rtklib_all_epochs.{field}"
max = 0.0
readme = "lower Hmed/Hp95/Vp95 (--preset urban)"
foreach = [{ field = "median_h_m" }, { field = "p95_h_m" }, { field = "p95_abs_up_m" }]

[[metrics]]
name = "default {field} minus demo5 (m)"
source = "{work_dir}/default/summary.json"
path = "libgnss_all_epochs.{field}"
minus_path = "rtklib_all_epochs.{field}"
max = 0.0
readme = "lower Hp95/Vp95 (default)"
foreach = [{ field = "p95_h_m" }, { field = "p95_abs_up_m" }]

# docs/benchmarks.md Odaiba snapshot values; reported, not gated.
[[metrics]]
name = "table: RTKLIB demo5 {field}"
source = "{work_dir}/default/summary.json"
path = "rtklib_all_epochs.{field}"
gate = false
readme = "docs/benchmarks.md table"
foreach = [
  { field = "fix_epochs", expected = 5839.000, abs_tol = 0 },
  { field = "fix_rate_pct", expected = 48.340, abs_tol = 0.005 },
  { field = "median_h_m", expected = 0.190, abs_tol = 0.0005 },
  { field = "p95_h_m", expected = 7.856, abs_tol = 0.0005 },
  { field = "p95_abs_up_m", expected = 15.722, abs_tol = 0.0005 },
  { field = "fix_wrong_gt_0p5_m", expected = 19, abs_tol = 0 },
  { field = "fix_wrong_gt_2_m", expected = 4, abs_tol = 0 },
  { field = "fix_wrong_gt_3_m", expected = 4, abs_tol = 0 },
]

[[metrics]]
name = "table: libgnss++ default {field}"
source = "{work_dir}/default/summary.json"
path = "libgnss_all_epochs.{field}"
gate = false
readme = "docs/benchmarks.md table"
foreach = [
  { field = "fix_epochs", expected = 1298.000, abs_tol = 20 },
  { field = "fix_rate_pct", expected = 11.816, abs_tol = 0.2 },
  { field = "median_h_m", expected = 0.359, abs_tol = 0.01 },
  { field = "p95_h_m", expected = 4.777, abs_tol = 0.1 },
  { field = "p95_abs_up_m", expected = 11.537, abs_tol = 0.2 },
  { field = "fix_wrong_gt_0p5_m", expected = 0, abs_tol = 2 },
  { field = "fix_wrong_gt_2_m", expected = 0, abs_tol = 1 },
  { field = "fix_wrong_gt_3_m", expected = 0, abs_tol = 1 },
]

# `--preset odaiba` = low-cost profile + arc-smoothed MW wide-lane AR
# (--wide-lane-min-arc-samples 100). Gated against the default arm: more fixes
# and lower Hmed. Its Hp95/Vp95 over all emitted epochs are reported, not
# gated: the preset's 10 m+ vertical errors are almost all (604 of 629) in two
# stationary deep-canyon windows (tow 273750-273860, 274230-274300) with up to
# 28 m vertical error, so its all-epoch Vp95 sits inside that plateau.
# The old 2026-09-29 gate (preset Vp95 9.74 < default 16.42 m) held only
# because two FLOAT post-filters happened to blank those windows; the BeiDou
# B1I fix (#577) and the RTK-internal SPP sigma gate (#588) changed the fix
# pattern so they no longer fire. With the filters off the pre-#577 preset
# Vp95 was already 14.74 m. After the Doppler/phase slip-test interval fix
# (2026-10-11: preset 7961 fixes, Hp95 5.284 m, Vp95 13.892 m; default arm
# unchanged) the preset Vp95 is also higher on the 9,906 epochs both arms emit
# (11.81 vs 10.52 m). An earlier "lower on common epochs" figure (7.38 vs
# 9.41 m on 9,615 epochs) used a different epoch matching and is not
# comparable; it is withdrawn. See docs/benchmarks.md.
[[metrics]]
name = "preset odaiba fix epochs minus default"
source = "{work_dir}/preset_odaiba/summary.json"
path = "libgnss_all_epochs.fix_epochs"
minus_source = "{work_dir}/default/summary.json"
minus_path = "libgnss_all_epochs.fix_epochs"
min = 1
readme = "docs/benchmarks.md preset row"

[[metrics]]
name = "preset odaiba median_h_m minus default (m)"
source = "{work_dir}/preset_odaiba/summary.json"
path = "libgnss_all_epochs.median_h_m"
minus_source = "{work_dir}/default/summary.json"
minus_path = "libgnss_all_epochs.median_h_m"
max = 0.0
readme = "docs/benchmarks.md preset row"

[[metrics]]
name = "preset odaiba {field} minus default (m)"
source = "{work_dir}/preset_odaiba/summary.json"
path = "libgnss_all_epochs.{field}"
minus_source = "{work_dir}/default/summary.json"
minus_path = "libgnss_all_epochs.{field}"
max = 0.0
gate = false
readme = "docs/benchmarks.md preset row (reported, not gated)"
foreach = [{ field = "p95_h_m" }, { field = "p95_abs_up_m" }]

[[metrics]]
name = "table: libgnss++ --preset odaiba {field}"
source = "{work_dir}/preset_odaiba/summary.json"
path = "libgnss_all_epochs.{field}"
gate = false
readme = "docs/benchmarks.md table"
foreach = [
  { field = "fix_epochs", expected = 7961.000, abs_tol = 120 },
  { field = "fix_rate_pct", expected = 79.245, abs_tol = 1.2 },
  { field = "median_h_m", expected = 0.043, abs_tol = 0.01 },
  { field = "p95_h_m", expected = 5.258, abs_tol = 0.1 },
  { field = "p95_abs_up_m", expected = 13.110, abs_tol = 0.2 },
  { field = "fix_wrong_gt_0p5_m", expected = 109, abs_tol = 20 },
  { field = "fix_wrong_gt_2_m", expected = 5, abs_tol = 3 },
  { field = "fix_wrong_gt_3_m", expected = 5, abs_tol = 3 },
]

[[metrics]]
name = "table: libgnss++ --preset urban {field}"
source = "{work_dir}/preset_urban/summary.json"
path = "libgnss_all_epochs.{field}"
gate = false
readme = "docs/benchmarks.md table"
foreach = [
  { field = "fix_epochs", expected = 7467.000, abs_tol = 120 },
  { field = "fix_rate_pct", expected = 67.975, abs_tol = 1.2 },
  { field = "median_h_m", expected = 0.046, abs_tol = 0.01 },
  { field = "p95_h_m", expected = 4.860, abs_tol = 0.1 },
  { field = "p95_abs_up_m", expected = 10.770, abs_tol = 0.2 },
  { field = "fix_wrong_gt_0p5_m", expected = 9, abs_tol = 5 },
  { field = "fix_wrong_gt_2_m", expected = 0, abs_tol = 1 },
  { field = "fix_wrong_gt_3_m", expected = 0, abs_tol = 1 },
]
