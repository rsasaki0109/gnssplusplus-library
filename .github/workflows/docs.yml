name: Docs

on:
  push:
    branches: [ develop ]
    paths:
      - ".github/workflows/docs.yml"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/generate_architecture_diagram.py"
      - "tests/test_cli_ux.py"
      # Browser GUI (/app/): the WebAssembly tools are built from the C++ tree.
      - "web/**"
      - "wasm/**"
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "apps/native/**"
      - "third_party/**"
      - "tests/fixtures/realtime_stress/**"
      - "demo/fixtures/**"
  pull_request:
    branches: [ main, develop ]
    paths:
      - ".github/workflows/docs.yml"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/generate_architecture_diagram.py"
      - "tests/test_cli_ux.py"
      # Browser GUI (/app/): the WebAssembly tools are built from the C++ tree.
      - "web/**"
      - "wasm/**"
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "apps/native/**"
      - "third_party/**"
      - "tests/fixtures/realtime_stress/**"
      - "demo/fixtures/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Official Emscripten SDK image used for the browser build (docs/web_app.md).
  EMSDK_IMAGE: emscripten/emsdk:4.0.10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install docs dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-docs.txt
      - name: Run docs CLI UX contract
        run: python tests/test_cli_ux.py
      - name: Generate docs visuals
        env:
          MPLBACKEND: Agg
        run: python scripts/generate_architecture_diagram.py --output docs/libgnsspp_architecture.png
      - name: Build MkDocs site
        run: python -m mkdocs build --strict
      - name: Restore WebAssembly tools
        id: wasm-cache
        uses: actions/cache@v6
        with:
          path: build-wasm/wasm/dist
          key: wasm-${{ env.EMSDK_IMAGE }}-${{ hashFiles('CMakeLists.txt', 'wasm/CMakeLists.txt', 'src/**', 'include/**', 'apps/native/**', 'third_party/**') }}
      - name: Build WebAssembly tools (Emscripten)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: >-
          docker run --rm -v "$PWD:/src" -w /src "$EMSDK_IMAGE"
          bash -c "apt-get update -qq
          && apt-get install -y -qq --no-install-recommends cmake make libeigen3-dev > /dev/null
          && bash wasm/build.sh build-wasm"
      - name: Test browser GUI modules
        run: node --test web/test/web_app.test.mjs
      # Public PPP correction samples for the MADOCA-PPP / CLAS / Galileo HAS
      # checks: only the files wasm/test/smoke.mjs lists (PPP_SAMPLES), at
      # pinned commits.
      - name: Fetch the MADOCALIB sample (MIZU, 2025-04-01 00-01 h)
        uses: actions/checkout@v7
        with:
          repository: QZSS-Strategy-Office/madocalib
          ref: 0089f7dc97e8e2ba283a40be2edf4b73a140df6c
          path: ppp-samples/madocalib
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            sample_data/data/rinex/MIZU00JPN_R_20250910000_01D_30S_MO.rnx
            sample_data/data/rinex/BRDM00DLR_S_20250910000_01D_MN.rnx
            sample_data/data/igs20.atx
            sample_data/data/l6_is-qzss-mdc-004/2025/091/2025091A.204.l6
            sample_data/data/l6_is-qzss-mdc-004/2025/091/2025091A.206.l6
            sample_data/data/l6/2025/091/2025091A.200.l6
            sample_data/data/l6/2025/091/2025091A.201.l6
      - name: Fetch the CLASLIB sample (2019-08-27)
        uses: actions/checkout@v7
        with:
          repository: QZSS-Strategy-Office/claslib
          ref: 4320e84498efe5faeb1f3433949de40d972e745a
          path: ppp-samples/claslib
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/0627239Q.obs
            data/sept_2019239.nav
            data/2019239Q.l6
      # License not stated upstream: checked out for the test only, never published.
      - name: Fetch the cssrlib-data Galileo HAS samples (OBE4 IDD, Kamakura E6-B)
        uses: actions/checkout@v7
        with:
          repository: hirokawa/cssrlib-data
          ref: ec1dfa2c7095064ed6f89ff72bdb36505ade3fcb
          path: ppp-samples/cssrlib-data
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/doy2023-229/OBE42023229c.obs
            data/doy2023-229/OBE42023229c.nav
            data/doy2023-229/idd2023229c.rtc
            data/doy2025-046/046r_rnx.obs
            data/doy2025-046/046r_rnx.nav
            data/doy2025-046/046r_gale6.txt
      - name: Smoke-test WebAssembly tools (demo pipeline and PPP corrections in Node)
        run: node wasm/test/smoke.mjs build-wasm/wasm/dist --samples ppp-samples
      - name: Add browser GUI to the site (/app/)
        run: python wasm/assemble_site.py --dist build-wasm/wasm/dist --out site/app
      - name: Install Playwright Chromium for the browser GUI test
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser test of the GUI (real WebAssembly tools in Chromium)
        env:
          PLAYWRIGHT_PREFIX: ${{ runner.temp }}/pw
        run: node wasm/test/browser.mjs site --samples ppp-samples --screenshots "$RUNNER_TEMP/browser-test"
      - name: Keep the browser test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-screenshots
          path: ${{ runner.temp }}/browser-test
          if-no-files-found: ignore
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # Preserve v3's inclusion of non-.git/.github dotfiles.
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
